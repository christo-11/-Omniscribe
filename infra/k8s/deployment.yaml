apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniscribe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omniscribe-backend
  template:
    metadata:
      labels:
        app: omniscribe-backend
    spec:
      containers:
        - name: backend
          image: omniscribe/backend:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: omniscribe-backend
spec:
  selector:
    app: omniscribe-backend
  ports:
    - port: 8000
      targetPort: 8000
