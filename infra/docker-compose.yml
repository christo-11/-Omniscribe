services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      OMNISCRIBE_ENV: development
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend/nextjs-app:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend
